name: Build Academic Pages site

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify core pages
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/cv/index.html
          grep -Fq "Junteng Liu" _site/index.html
          grep -Fq "SynLogic" _site/index.html
          grep -Fq "Publications" _site/publications/index.html
